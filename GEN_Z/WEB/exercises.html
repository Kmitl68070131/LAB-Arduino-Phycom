<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN_Z MQTT Website</title><style>body{font:16px system-ui;background:#0b1324;color:#e8f4ff;margin:0;padding:28px}h1{color:#6ee7d8}button{border:1px solid #46647d;border-radius:10px;padding:12px;background:#1c304a;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#18283f;padding:16px;border-radius:16px}.card strong{display:block;font-size:24px;color:#70e6d9}input{padding:10px;background:#132239;color:white;border:1px solid #48627d;border-radius:9px}small{color:#a6bad4}</style><h1>GEN_Z — MQTT Website</h1><p>แสดงค่าจากแบบฝึกหัด 12 ข้อ · 68070131/#</p><p id="status">เชื่อมต่อ Bridge ...</p><div class="grid" id="grid"></div><h2>MQTT Control</h2><p>ส่งคำสั่งไปยังอุปกรณ์ผ่าน Bridge (ต้องเปิด server.js)</p><input id="topic" value="68070131/08_mqtt_keypad_rx"><input id="payload" value="1"><button id="send">ส่งคำสั่ง</button><pre id="log"></pre><script>const lessons=[{"id":"01_7SEG_0to9","title":"7-Segment นับเลข 0–9"},{"id":"02_7SEG_STUDENT_ID","title":"7-Segment แสดงรหัสทีละคู่"},{"id":"03_LED_FADING_4","title":"LED PWM Fading สี่รูปแบบ"},{"id":"04_KEYPAD_TO_7SEG","title":"Keypad กดเลขแสดง 7-Segment"},{"id":"05_LCD_HEART","title":"LCD Custom Font หัวใจ"},{"id":"06_TMP36_LCD","title":"TMP36 แสดงอุณหภูมิบน LCD"},{"id":"07_MQTT_KEYPAD_TX","title":"MQTT Keypad ส่งปุ่มขึ้นเว็บ"},{"id":"08_MQTT_KEYPAD_RX","title":"MQTT Keypad รับปุ่มจากเว็บ"},{"id":"09_MQTT_POT_TX","title":"MQTT Potentiometer ส่ง Analog"},{"id":"10_MQTT_LED_FADE_RX","title":"MQTT LED Fading รับค่า Analog"},{"id":"11_MQTT_RGB_WEB","title":"MQTT RGB ควบคุมสีจากเว็บ"},{"id":"12_ULTRASONIC_WEB","title":"Ultrasonic วัดระยะขึ้นเว็บ"}];const grid=document.getElementById('grid');for(const l of lessons){const c=document.createElement('div');c.className='card';c.dataset.topic='68070131/'+l.id.toLowerCase();c.innerHTML='<small>'+l.id+'</small><p>'+l.title+'</p><strong>--</strong>';grid.append(c)}const s=new EventSource('/events');s.onopen=()=>document.getElementById('status').textContent='เชื่อมต่อ Bridge แล้ว';s.onerror=()=>document.getElementById('status').textContent='Bridge ยังไม่ทำงาน';s.onmessage=e=>{const m=JSON.parse(e.data),c=[...grid.children].find(x=>x.dataset.topic===m.topic);if(c)c.querySelector('strong').textContent=m.payload;document.getElementById('log').textContent=m.topic+' = '+m.payload+'\n'+document.getElementById('log').textContent.slice(0,4000)};document.getElementById('send').onclick=async()=>{const topic=document.getElementById('topic').value,payload=document.getElementById('payload').value;const r=await fetch('/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,payload})});alert(r.ok?'ส่งคำสั่งแล้ว':'ส่งไม่ได้')};</script>
