<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355"><rect width="1000" height="355" fill="#f8fafb"/><text x="26" y="43" font-size="22" font-family="Arial" font-weight="bold" fill="#123c48">LAB 9: Keypad 4×4 ส่งปุ่มขึ้นเว็บและแสดง LCD</text><rect x="24" y="70" width="340" height="259" rx="12" fill="#e5f4f3" stroke="#509b95"/><text x="45" y="110" font-family="Arial" font-size="18" fill="#21605d">Arduino UNO R4 WiFi</text><rect x="405" y="70" width="570" height="259" rx="12" fill="#fff5e9" stroke="#c9a172"/><text x="426" y="110" font-family="Arial" font-size="18" fill="#845922">Sensor / Module / LCD</text><circle cx="360" cy="142" r="5" fill="#427b88"/><line x1="360" y1="142" x2="405" y2="142" stroke="#af8750" stroke-width="3"/><text x="45" y="149" font-family="Arial" font-size="15" fill="#234b55">Sensor wiring</text><text x="425" y="149" font-family="Arial" font-size="15" fill="#635039">Keypad ROW1–ROW4→D2,D3,D4,D5</text><circle cx="360" cy="187" r="5" fill="#427b88"/><line x1="360" y1="187" x2="405" y2="187" stroke="#af8750" stroke-width="3"/><text x="45" y="194" font-family="Arial" font-size="15" fill="#234b55">Sensor wiring</text><text x="425" y="194" font-family="Arial" font-size="15" fill="#635039">Keypad COL1–COL4→D6,D7,D8,D9</text><circle cx="360" cy="232" r="5" fill="#427b88"/><line x1="360" y1="232" x2="405" y2="232" stroke="#af8750" stroke-width="3"/><text x="45" y="239" font-family="Arial" font-size="15" fill="#234b55">Sensor wiring</text><text x="425" y="239" font-family="Arial" font-size="15" fill="#635039">ตรวจลำดับสายของ Keypad จริงก่อนใช้งาน</text><circle cx="360" cy="277" r="5" fill="#427b88"/><line x1="360" y1="277" x2="405" y2="277" stroke="#af8750" stroke-width="3"/><text x="45" y="284" font-family="Arial" font-size="15" fill="#234b55">LCD wiring</text><text x="425" y="284" font-family="Arial" font-size="15" fill="#635039">LCD I2C 16×2: VCC→5V, GND→GND, SDA→SDA, SCL→SCL</text><circle cx="360" cy="322" r="5" fill="#427b88"/><line x1="360" y1="322" x2="405" y2="322" stroke="#af8750" stroke-width="3"/><text x="45" y="329" font-family="Arial" font-size="15" fill="#234b55">LCD wiring</text><text x="425" y="329" font-family="Arial" font-size="15" fill="#635039">LCD Address ตัวอย่าง 0x27; ถ้าจอไม่ขึ้น ให้ใช้ I2C Scanner ตรวจที่อยู่จริง</text></svg>